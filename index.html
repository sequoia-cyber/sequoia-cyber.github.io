    <style>
        /* 全局样式：彻底抛弃宋体，统一使用现代无衬线字体 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, Arial, sans-serif;

        /* 顶部滚动横幅样式 */
        .marquee-container {
            position: absolute; top: 0; width: 100%;

            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10;

        /* 主内容区域样式 */
        .content-box { text-align: center; padding: 20px; max-width: 90%; }

        .main-text {
            font-size: 5vw; font-weight: 900; line-height: 1.3;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        /* 倒计时通用样式：现代化字体 + 等宽数字 */
        .countdown {
            font-size: 3vw; font-weight: bold; margin-top: 20px;
            font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, Arial, sans-serif;
            font-variant-numeric: tabular-nums; letter-spacing: 1px;
            transition: color 0.5s ease; /* 颜色切换增加平滑过渡 */

        .countdown.practice { color: #3498db; }
        .countdown.discuss { color: #2ecc71; }
        .countdown.discuss.active { color: #e74c3c; } /* 22:30后激活红色 */

            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }

        .heartbeat-anim { display: inline-block; animation: heartbeat 1s infinite; }

        .sub-text { font-size: 3vw; color: #bdc3c7; margin-top: 30px; line-height: 1.6; }

        .btn-rebel { background-color: #e67e22; color: #fff; }
        .btn-stubborn { background-color: #c0392b; color: #fff; }
        .btn-admit { background-color: #27ae60; color: #fff; }
        /* 底部信息栏（包含科目表、时钟与名言） */
        .bottom-bar {
            position: absolute; bottom: 30px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        /* 科目表样式：现代化字体 */

            font-size: 2.5vw; line-height: 1.8; color: #ecf0f1;
            background: rgba(255,255,255,0.1); padding: 15px 40px; border-radius: 10px;
            font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, Arial, sans-serif;
            font-weight: 500; letter-spacing: 1px;
        }
        .schedule span { color: #f1c40f; font-weight: bold; }

            display: flex; align-items: center; gap: 15px;

        }
        #quoteDisplay { display: inline-block; transition: opacity 0.25s ease, transform 0.25s ease; }
        #quoteDisplay.quote-out { opacity: 0; transform: translateY(10px); }

            padding: 8px 15px; font-size: 1.5vw; border: none; border-radius: 15px;
            background-color: #f39c12; color: #111; cursor: pointer; font-weight: bold;
            transition: all 0.3s;
            font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, Arial, sans-serif;
        }
        .quote-btn:hover { background-color: #e67e22; transform: scale(1.05); }
        /* “换一句”按钮点击弹跳旋转动画 */
        .quote-btn.spinning { animation: quoteBtnPop 0.6s ease; }
        @keyframes quoteBtnPop {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-10deg); }
            55% { transform: scale(0.9) rotate(8deg); }
            80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        /* ============ 顶部控制区：语言切换 + 主题切换 ============ */
        .top-controls {
            position: absolute; top: 70px; right: 20px; z-index: 20;
            display: flex; gap: 12px; align-items: center;
        }
        .theme-btn {
            padding: 10px 22px; font-size: 1.5vw; border: none; border-radius: 30px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
            background-color: #34495e; color: #fff;
            font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, Arial, sans-serif;

        }
        .theme-btn:hover { transform: scale(1.08); opacity: 0.92; }

见其光，君子贵其全也。";

                btnStillNo: 'Ich will trotzdem nicht',
                btnLifeText: 'Ohne Übung läuft dein Leben schon aus dem Ruder!!',
                btnAdmit: 'Lehrer, ich habe es verstanden, ich übe sofort',
                btnGoodText: 'Fehler einzusehen ist das Beste! Ran an den Stift! ✍️',
                quoteBtn: 'Neues Zitat',
                themeBtn: { dark: 'Dunkelmodus', light: 'Hellmodus', green: 'Grünmodus' },
                marquee: 'Lernen darf niemals aufhören. Das Indigoblau, aus der Indigopflanze gewonnen, ist blauer als die Pflanze; das Eis, aus Wasser entstanden, ist kälter als das Wasser. Wer keine kleinen Schritte sammelt, kommt nicht tausend Meilen weit; wer keine kleinen Bäche sammelt, bildet keinen großen Strom. — Xunzi, Ermunterung zum Lernen',
                quotes: [
                    'Die Handschrift ist der Spiegel des Menschen — der Charakter kommt zuerst.',
                    'Tausend Pinsel abgenutzt, zehntausend Tintenstangen zerrieben — erst dann erstrahlt ein Zeichen.',
                    'Ist das Herz aufrecht, ist auch der Stift aufrecht.',
                    'Kalligrafie ist die Malerei des Herzens.',
                    'Schreiben üben heißt den Geist üben — ein ruhiges Herz macht alles klar.',
                    'Ohne kleine Schritte gibt es keine Reise von tausend Meilen.',
                    'Im Gebirge der Bücher ist der Fleiß der einzige Pfad.'
                ]
            }
        };
        let currentLang = localStorage.getItem('pageLang') || 'zh';
        if (!I18N[currentLang]) currentLang = 'zh';
        const T = () => I18N[currentLang];

        // 按钮状态控制
        let btnState = 0;

        // 名言生成器逻辑（名言库随当前语言切换）
        let lastQuoteIndex = -1;
        function generateQuote() {
            const list = T().quotes;
            let index;
            do {
                index = Math.floor(Math.random() * list.length);
            } while (index === lastQuoteIndex && list.length > 1);
            lastQuoteIndex = index;
            document.getElementById('quoteDisplay').innerText = `“${list[index]}”`;
        }
        // 带淡出淡入动画地切换名言
        function animateQuoteChange() {
            const qd = document.getElementById('quoteDisplay');
            qd.classList.add('quote-out');
            setTimeout(() => {
                generateQuote();
                qd.classList.remove('quote-out');
            }, 250);
        }
        // 点击“换一句”按钮：按钮弹跳旋转动画 + 名言淡出淡入
        window.quoteBtnClick = function (btn) {
            btn.classList.remove('spinning');
            void btn.offsetWidth; // 重置动画，保证连点也能播放
            btn.classList.add('spinning');
            animateQuoteChange();
        };

        // 按当前语言格式化日期
        function buildDateStr(now) {
            const L = T();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const wd = L.weekdays[now.getDay()];
            const mName = L.months ? L.months[now.getMonth()] : '';
            return L.datePattern
                .replace('{y}', y).replace('{m}', m).replace('{d}', d)
                .replace('{wd}', wd).replace('{mName}', mName);
        }
        // 更新实时日期和时间的函数
        function updateClock() {
            const now = new Date();
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockDisplay').innerText = `📅 ${buildDateStr(now)} | ⏰ ${T().clockLabel}${h}:${m}:${s}`;
        }

        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const L = T();

            const mainDisplay = document.getElementById('mainDisplay');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const discussCountdownDisplay = document.getElementById('discussCountdownDisplay');
            const scheduleDisplay = document.getElementById('scheduleDisplay');
            const btnContainer = document.getElementById('btnContainer');

            // 1. 始终显示科目表（随语言翻译）
            const today = now.getDay();
            const tomorrow = (today + 1) % 7;
            scheduleDisplay.innerHTML = `${L.todaySched}<span>${L.subjects[today]}</span> | ${L.tomorrowSched}<span>${L.subjects[tomorrow]}</span>`;

            // 2. 始终显示距离小组讨论的倒计时（带颜色切换）
            let discussTarget = new Date(now);
            discussTarget.setHours(22, 30, 0, 0);
            let discussDiff = discussTarget - now;
            if (discussDiff > 0) {
                discussCountdownDisplay.classList.remove('active'); // 移除红色
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> ${L.discussIn}${formatTime(discussDiff)}`;
            } else {
                discussCountdownDisplay.classList.add('active'); // 激活红色
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">🔥</span> ${L.discussNow}`;
            }

            // 2.5 始终显示距离2027年高考（6月7日09:00开考）的倒计时
            const gaokaoDiff = GAOKAO_TARGET - now;
            const gaokaoDisplay = document.getElementById('gaokaoCountdownDisplay');
            if (gaokaoDiff > 0) {
                const gkTotalSec = Math.floor(gaokaoDiff / 1000);
                const gkDays = Math.floor(gkTotalSec / 86400);
                const gh = String(Math.floor((gkTotalSec % 86400) / 3600)).padStart(2, '0');
                const gm = String(Math.floor((gkTotalSec % 3600) / 60)).padStart(2, '0');
                const gs = String(gkTotalSec % 60).padStart(2, '0');
                gaokaoDisplay.innerHTML = `<span class="heartbeat-anim">🎓</span> ${L.gaokaoIn}${gkDays}${L.gaokaoDay} ${gh}:${gm}:${gs}`;
            } else {
                gaokaoDisplay.innerHTML = `<span class="heartbeat-anim">🔥</span> ${L.gaokaoNow}`;
            }

            // 3. 根据时间段切换主提示
            mainDisplay.innerHTML = '';
            countdownDisplay.innerHTML = '';
            btnContainer.innerHTML = '';

            // === 22:30 之后：小组讨论模式 ===
            if (hours > 22 || (hours === 22 && minutes >= 30)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = L.mainNight;
            }
            // === 19:00 - 22:29：练字结束灵魂拷问 ===
            else if (hours >= 19) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#95a5a6';
                mainDisplay.style.textShadow = '3px 3px 0 #2c3e50, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = L.mainDone;
            }
            // === 18:50 - 19:00：练字大字报 + 按钮触发区 ===
            else if (hours === 18 && minutes >= 50) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#f1c40f';
                mainDisplay.style.textShadow = '3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = L.mainHurry;

                let practiceTarget = new Date(now);
                practiceTarget.setHours(19, 0, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏱️</span> ${L.practiceEnd}${formatTime(practiceDiff)}`;
                }
                renderButtons(btnContainer);
            }
            // === 18:50 之前：练字提示模式 ===
            else {
                mainDisplay.className = 'sub-text';
                mainDisplay.innerHTML = L.mainChinese;

                let practiceTarget = new Date(now);
                practiceTarget.setHours(18, 50, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> ${L.practiceIn}${formatTime(practiceDiff)}`;
                }
            }
        }

        // 渲染按钮的独立函数（文案随语言翻译）
        function renderButtons(container) {
            const L = T();
            if (btnState === 0) {
                container.innerHTML = `<button class="btn btn-rebel" onclick="changeBtnState(1)">${L.btnNoPractice}</button>`;
            } else if (btnState === 1) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#e67e22;">${L.btnRebelText}</div>
                    <button class="btn btn-stubborn" onclick="changeBtnState(2)">${L.btnStillNo}</button>
                `;
            } else if (btnState === 2) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#c0392b; font-weight:bold;">${L.btnLifeText}</div>
                    <button class="btn btn-admit" onclick="changeBtnState(3)">${L.btnAdmit}</button>
                `;
            } else if (btnState === 3) {
                container.innerHTML = `<div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#2ecc71;">${L.btnGoodText}</div>`;
            }
        }

        // 切换按钮状态
        window.changeBtnState = function (state) {
            btnState = state;
            checkTime();
        }

        // 格式化时间函数
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // ============ 主题切换逻辑 ============
        const themeList = ['dark', 'light', 'green'];
        const themeIcons = { dark: '🌙', light: '☀️', green: '🌿' };
        let currentTheme = localStorage.getItem('pageTheme') || 'dark';
        function applyTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-green');
            if (theme === 'light') document.body.classList.add('theme-light');
            if (theme === 'green') document.body.classList.add('theme-green');
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerText = `${themeIcons[theme]} ${T().themeBtn[theme]}`;
            localStorage.setItem('pageTheme', theme);
        }
        window.toggleTheme = function () {
            const idx = themeList.indexOf(currentTheme);
            currentTheme = themeList[(idx + 1) % themeList.length];
            applyTheme(currentTheme);
        }

        // ============ 语言切换逻辑 ============
        function setLanguage(lang) {
            if (!I18N[lang]) return;
            currentLang = lang;
            localStorage.setItem('pageLang', lang);
            const L = T();
            document.documentElement.lang = L.htmlLang;
            document.title = L.title;
            document.getElementById('customMarquee').innerText = L.marquee;
            document.getElementById('quoteBtn').innerText = L.quoteBtn;
            const sel = document.getElementById('langSelect');
            if (sel) sel.value = lang;
            lastQuoteIndex = -1;
            generateQuote();      // 立即换成当前语言的名言
            applyTheme(currentTheme); // 刷新主题按钮文字
            checkTime();          // 刷新倒计时与主提示
            updateClock();        // 刷新日期时间
        }
        window.setLanguage = setLanguage;

        // 页面加载时立即执行一次
        (function init() {
            const L = T();
            document.documentElement.lang = L.htmlLang;
            document.title = L.title;
            document.getElementById('customMarquee').innerText = L.marquee;
            document.getElementById('quoteBtn').innerText = L.quoteBtn;
            document.getElementById('langSelect').value = currentLang;
            generateQuote();
            applyTheme(currentTheme);
            checkTime();
            updateClock();
        })();
        setInterval(checkTime, 1000);
        setInterval(updateClock, 1000);
        setInterval(animateQuoteChange, 10000);
    </script>
</body>
</html>
