<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级日程提醒</title>
    <style>
        /* 全局样式：彻底抛弃宋体，使用微软雅黑 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* 顶部滚动横幅样式 */
        .marquee-container {
            position: absolute; top: 0; width: 100%;
            background-color: #e74c3c; padding: 15px 0;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10;
        }
        marquee { color: #fff; }

        /* 主内容区域样式 */
        .content-box { text-align: center; padding: 20px; max-width: 90%; }

        /* 大字报核心文字样式 */
        .main-text {
            font-size: 5vw; font-weight: 900; line-height: 1.3;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        /* 倒计时通用样式 */
        .countdown {
            font-size: 3vw; font-weight: bold; margin-top: 20px;
            font-family: 'Courier New', Courier, monospace; 
            transition: color 0.5s ease; /* 颜色切换增加平滑过渡 */
        }
        .countdown.practice { color: #3498db; } 
        .countdown.discuss { color: #2ecc71; }  
        .countdown.discuss.active { color: #e74c3c; } /* 22:30后激活红色 */

        /* 倒计时趣味心跳动画 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }
        .heartbeat-anim { display: inline-block; animation: heartbeat 1s infinite; }

        /* 提示文字与按钮样式 */
        .sub-text { font-size: 3vw; color: #bdc3c7; margin-top: 30px; line-height: 1.6; }
        .btn-group { margin-top: 40px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px; font-size: 2vw; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-rebel { background-color: #e67e22; color: #fff; }
        .btn-stubborn { background-color: #c0392b; color: #fff; }
        .btn-admit { background-color: #27ae60; color: #fff; }

        /* 底部信息栏（包含科目表、时钟与名言） */
        .bottom-bar {
            position: absolute; bottom: 30px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* 科目表样式 */
        .schedule {
            font-size: 2.5vw; line-height: 1.8; color: #ecf0f1;
            background: rgba(255,255,255,0.1); padding: 15px 40px; border-radius: 10px;
        }
        .schedule span { color: #f1c40f; font-weight: bold; }

        /* 自动更新日期时间样式 */
        .realtime-clock {
            font-size: 2vw; color: #95a5a6;
            font-family: 'Courier New', Courier, monospace; 
        }

        /* 名言生成器样式 */
        .quote-box {
            display: flex; align-items: center; gap: 15px;
            font-size: 1.8vw; color: #f39c12; font-style: italic;
            background: rgba(243, 156, 18, 0.1); padding: 10px 25px; border-radius: 20px;
        }
        .quote-btn {
            padding: 8px 15px; font-size: 1.5vw; border: none; border-radius: 15px;
            background-color: #f39c12; color: #111; cursor: pointer; font-weight: bold;
            transition: all 0.3s;
        }
        .quote-btn:hover { background-color: #e67e22; transform: scale(1.05); }

        /* 呼吸闪烁动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 顶部滚动横幅 -->
    <div class="marquee-container">
        <marquee id="customMarquee" behavior="scroll" direction="left" scrollamount="8"></marquee>
    </div>

    <!-- 主内容区域 -->
    <div class="content-box">
        <div id="mainDisplay"></div>
        <div id="countdownDisplay"></div>
        <div id="discussCountdownDisplay" class="countdown discuss"></div>
        <div id="btnContainer" class="btn-group"></div>
    </div>

    <!-- 底部信息栏 -->
    <div class="bottom-bar">
        <div id="scheduleDisplay" class="schedule"></div>
        <div id="clockDisplay" class="realtime-clock"></div> 
        <!-- 名言生成器 -->
        <div class="quote-box">
            <span id="quoteDisplay"></span>
            <button class="quote-btn" onclick="generateQuote()">换一句</button>
        </div>
    </div>

    <script>
        // ================= 自定义配置区 =================
        const MARQUEE_TEXT = "君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。故不登高山，不知天之高也；不临深溪，不知地之厚也；不闻先王之遗言，不知学问之大也。干、越、夷、貉之子，生而同声，长而异俗，教使之然也。诗曰：“嗟尔君子，无恒安息。靖共尔位，好是正直。神之听之，介尔景福。”神莫大于化道，福莫长于无祸。吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。(君子生 通：性)南方有鸟焉，名曰蒙鸠，以羽为巢，而编之以发，系之苇苕，风至苕折，卵破子死。巢非不完也，所系者然也。西方有木焉，名曰射干，茎长四寸，生于高山之上，而临百仞之渊，木茎非能长也，所立者然也。蓬生麻中，不扶而直；白沙在涅，与之俱黑。兰槐之根是为芷，其渐之滫，君子不近，庶人不服。其质非不美也，所渐者然也。故君子居必择乡，游必就士，所以防邪辟而近中正也。物类之起，必有所始。荣辱之来，必象其德。肉腐出虫，鱼枯生蠹。怠慢忘身，祸灾乃作。强自取柱，柔自取束。邪秽在身，怨之所构。施薪若一，火就燥也，平地若一，水就湿也。草木畴生，禽兽群焉，物各从其类也。是故质的张，而弓矢至焉；林木茂，而斧斤至焉；树成荫，而众鸟息焉。醯酸，而蜹聚焉。故言有招祸也，行有招辱也，君子慎其所立乎！积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。(江海 一作：江河)是故无冥冥之志者，无昭昭之明；无惛惛之事者，无赫赫之功。行衢道者不至，事两君者不容。目不能两视而明，耳不能两听而聪。螣蛇无足而飞，鼫鼠五技而穷。《诗》曰：“尸鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮！”故君子结于一也。昔者瓠巴鼓瑟，而流鱼出听；伯牙鼓琴，而六马仰秣。故声无小而不闻，行无隐而不形。玉在山而草木润，渊生珠而崖不枯。为善不积邪？安有不闻者乎？学恶乎始？恶乎终？曰：其数则始乎诵经，终乎读礼；其义则始乎为士，终乎为圣人，真积力久则入，学至乎没而后止也。故学数有终，若其义则不可须臾舍也。为之，人也；舍之，禽兽也。故书者，政事之纪也；诗者，中声之所止也；礼者，法之大分，类之纲纪也，故学至乎礼而止矣。夫是之谓道德之极。礼之敬文也，乐之中和也，诗书之博也，春秋之微也，在天地之间者毕矣。君子之学也，入乎耳，箸乎心，布乎四体，形乎动静。端而言，蝡而动，一可以为法则。小人之学也，入乎耳，出乎口；口耳之间，则四寸耳，曷足以美七尺之躯哉！古之学者为己，今之学者为人。君子之学也，以美其身；小人之学也，以为禽犊。故不问而告谓之傲，问一而告二谓之囋。傲非也，囋非也；君子如向矣。学莫便乎近其人。礼乐法而不说，诗书故而不切，春秋约而不速。方其人之习君子之说，则尊以遍矣，周于世矣。故曰：学莫便乎近其人。学之经莫速乎好其人，隆礼次之。上不能好其人，下不能隆礼，安特将学杂识志，顺诗书而已耳。则末世穷年，不免为陋儒而已。将原先王，本仁义，则礼正其经纬蹊径也。若挈裘领，诎五指而顿之，顺者不可胜数也。不道礼宪，以诗书为之，譬之犹以指测河也，以戈舂黍也，以锥餐壶也，不可以得之矣。故隆礼，虽未明，法士也；不隆礼，虽察辩，散儒也。问楛者，勿告也；告楛者，勿问也；说楛者，勿听也。有争气者，勿与辩也。故必由其道至，然后接之；非其道则避之。故礼恭，而后可与言道之方；辞顺，而后可与言道之理；色从而后可与言道之致。故未可与言而言，谓之傲；可与言而不言，谓之隐；不观气色而言，谓瞽。故君子不傲、不隐、不瞽，谨顺其身。诗曰：“匪交匪舒，天子所予。”此之谓也。百发失一，不足谓善射；千里蹞步不至，不足谓善御；伦类不通，仁义不一，不足谓善学。学也者，固学一之也。一出焉，一入焉，涂巷之人也；其善者少，不善者多，桀纣盗跖也；全之尽之，然后学者也。君子知夫不全不粹之不足以为美也，故诵数以贯之，思索以通之，为其人以处之，除其害者以持养之。使目非是无欲见也，使耳非是无欲闻也，使口非是无欲言也，使心非是无欲虑也。及至其致好之也，目好之五色，耳好之五声，口好之五味，心利之有天下。是故权利不能倾也，群众不能移也，天下不能荡也。生乎由是，死乎由是，夫是之谓德操。德操然后能定，能定然后能应。能定能应，夫是之谓成人。天见其明，地见其光，君子贵其全也。";
        const scheduleMap = { 0: '语文', 1: '数学', 2: '英语', 3: '物理', 4: '化学', 5: '生物学', 6: '无' };
        const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        // 名言库
        const quotes = [
            "字如其人，立品为先。",
            "笔秃千管，墨磨万锭，方得一字之妙。",
            "心正则笔正，笔正乃可法矣。",
            "书，心画也。",
            "练字亦练心，心静自然凉。",
            "不积跬步，无以至千里；不积小流，无以成江海。",
            "字要骨格，肉须裹筋，筋须藏肉，帖乃生韵。",
            "用笔在心，心正则笔正。",
            "书山有路勤为径，学海无涯苦作舟。",
            "高考可以再来，练字只有一次。",
            "书山有路勤为径，学海无涯苦作舟。",
            "区",
            "请输入文本",
            "Please enter text ",
            "Using ladder illegal",
            "都倒计时了，像点样吧！@全体成员",
            "虽有稿暴，不复挺者，𫐓使之然也。"
        ];
        // ================================================

        // 初始化横幅
        document.getElementById('customMarquee').innerText = MARQUEE_TEXT;

        // 按钮状态控制
        let btnState = 0; 

        // 名言生成器逻辑
        let lastQuoteIndex = -1;
        function generateQuote() {
            let index;
            do {
                index = Math.floor(Math.random() * quotes.length);
            } while (index === lastQuoteIndex && quotes.length > 1);
            
            lastQuoteIndex = index;
            document.getElementById('quoteDisplay').innerText = `“${quotes[index]}”`;
        }
        generateQuote();
        setInterval(generateQuote, 10000);

        // 更新实时日期和时间的函数
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekDay = weekDays[now.getDay()];
            
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clockDisplay').innerText = `📅 ${year}年${month}月${day}日 ${weekDay} | ⏰ 当前时间：${h}:${m}:${s}`;
        }

        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            const mainDisplay = document.getElementById('mainDisplay');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const discussCountdownDisplay = document.getElementById('discussCountdownDisplay');
            const scheduleDisplay = document.getElementById('scheduleDisplay');
            const btnContainer = document.getElementById('btnContainer');

            // 1. 始终显示科目表
            const today = now.getDay();
            const tomorrow = (today + 1) % 7;
            scheduleDisplay.innerHTML = `今日科目：<span>${scheduleMap[today]}</span> | 明日科目：<span>${scheduleMap[tomorrow]}</span>`;

            // 2. 始终显示距离小组讨论的倒计时（带颜色切换）
            let discussTarget = new Date(now);
            discussTarget.setHours(22, 30, 0, 0);
            let discussDiff = discussTarget - now;
            
            if (discussDiff > 0) {
                discussCountdownDisplay.classList.remove('active'); // 移除红色
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> 距离小组讨论还有：${formatTime(discussDiff)}`;
            } else {
                discussCountdownDisplay.classList.add('active'); // 激活红色
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">🔥</span> 小组讨论进行中...`;
            }

            // 3. 根据时间段切换主提示
            mainDisplay.innerHTML = '';
            countdownDisplay.innerHTML = '';
            btnContainer.innerHTML = ''; 

            // === 22:30 之后：小组讨论模式 ===
            if (hours > 22 || (hours === 22 && minutes >= 30)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = '什么时间该做什么事了哦，<br>昨天的讨论效果还是不错的哦。<br><span style="font-size:0.8em; color:#fff;">友情提示：<br>把你们的数理化作业收起来哦！</span>';
            } 
            // === 19:00 - 22:29：练字结束灵魂拷问 ===
            else if (hours >= 19) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#95a5a6'; 
                mainDisplay.style.textShadow = '3px 3px 0 #2c3e50, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '今天练字已经完成，<br>具体怎么样还是要靠自觉啊 🤔';
            } 
            // === 18:50 - 19:00：练字大字报 + 按钮触发区 ===
            else if (hours === 18 && minutes >= 50) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#f1c40f'; 
                mainDisplay.style.textShadow = '3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '什么时间该做什么事了，<br>不需要我多说了吧！';
                
                let practiceTarget = new Date(now);
                practiceTarget.setHours(19, 0, 0, 0); 
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏱️</span> 距离练字结束还有：${formatTime(practiceDiff)}`;
                }
                
                renderButtons(btnContainer);
            } 
            // === 18:50 之前：练字提示模式 ===
            else {
                mainDisplay.className = 'sub-text';
                mainDisplay.innerHTML = '语文也是150分哦，虽然不像数学物理那么难学，但也是重要的哦 ✍️';
                
                let practiceTarget = new Date(now);
                practiceTarget.setHours(18, 50, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> 距离练字还有：${formatTime(practiceDiff)}`;
                }
            }
        }

        // 渲染按钮的独立函数
        function renderButtons(container) {
            if (btnState === 0) {
                container.innerHTML = `<button class="btn btn-rebel" onclick="changeBtnState(1)">我不想练字</button>`;
            } else if (btnState === 1) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#e67e22;">你做的这道题，高考肯定不考。<br>但是你高考总是要写字的啊。</div>
                    <button class="btn btn-stubborn" onclick="changeBtnState(2)">我还是不想练字</button>
                `;
            } else if (btnState === 2) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#c0392b; font-weight:bold;">再不练字你的人生已经掉链子了！！</div>
                    <button class="btn btn-admit" onclick="changeBtnState(3)">恩师我知道错了，我这就去练字</button>
                `;
            } else if (btnState === 3) {
                container.innerHTML = `<div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#2ecc71;">知错能改，善莫大焉！赶紧动笔吧！✍️</div>`;
            }
        }

        // 切换按钮状态
        window.changeBtnState = function(state) {
            btnState = state;
            checkTime(); 
        }

        // 格式化时间函数
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 页面加载时立即执行一次
        checkTime();
        updateClock();
        setInterval(checkTime, 1000);
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
