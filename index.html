<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级日程提醒</title>
    <style>
        /* 全局样式：彻底抛弃宋体，使用微软雅黑 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* 顶部滚动横幅样式 */
        .marquee-container {
            position: absolute; top: 0; width: 100%;
            background-color: #e74c3c; padding: 15px 0;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10;
        }
        marquee { color: #fff; }

        /* 主内容区域样式 */
        .content-box { text-align: center; padding: 20px; max-width: 90%; }

        /* 大字报核心文字样式 */
        .main-text {
            font-size: 5vw; font-weight: 900; line-height: 1.3;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        /* 倒计时通用样式 */
        .countdown {
            font-size: 3vw; font-weight: bold; margin-top: 20px;
            font-family: 'Courier New', Courier, monospace; 
        }
        .countdown.practice { color: #3498db; } 
        .countdown.discuss { color: #2ecc71; }  

        /* 倒计时趣味心跳动画 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }
        .heartbeat-anim { display: inline-block; animation: heartbeat 1s infinite; }

        /* 提示文字与按钮样式 */
        .sub-text { font-size: 3vw; color: #bdc3c7; margin-top: 30px; line-height: 1.6; }
        .btn-group { margin-top: 40px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px; font-size: 2vw; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-rebel { background-color: #e67e22; color: #fff; }
        .btn-stubborn { background-color: #c0392b; color: #fff; }
        .btn-admit { background-color: #27ae60; color: #fff; }

        /* 科目表样式（常驻底部） */
        .schedule {
            position: absolute; bottom: 30px; font-size: 2.5vw; line-height: 1.8;
            color: #ecf0f1; background: rgba(255,255,255,0.1);
            padding: 15px 40px; border-radius: 10px; display: inline-block;
        }
        .schedule span { color: #f1c40f; font-weight: bold; }

        /* 呼吸闪烁动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 顶部滚动横幅 -->
    <div class="marquee-container">
        <marquee id="customMarquee" behavior="scroll" direction="left" scrollamount="8"></marquee>
    </div>

    <!-- 主内容区域 -->
    <div class="content-box">
        <div id="mainDisplay"></div>
        <div id="countdownDisplay"></div>
        <div id="discussCountdownDisplay" class="countdown discuss"></div>
        <div id="btnContainer" class="btn-group"></div>
    </div>

    <!-- 常驻底部的科目表 -->
    <div id="scheduleDisplay" class="schedule"></div>

    <script>
        // ================= 自定义配置区 =================
        // 在这里修改横幅内容，支持自定义！
        const MARQUEE_TEXT = "张正凯老师提醒您：把电子教室连起来哦 📢 张正凯老师提醒您：把电子教室连起来哦 📢";
        
        // 科目表配置 (0:周日, 1:周一 ... 6:周六)
        const scheduleMap = { 0: '语文', 1: '数学', 2: '英语', 3: '物理', 4: '化学', 5: '生物学', 6: '语文' };
        // ================================================

        // 初始化横幅
        document.getElementById('customMarquee').innerText = MARQUEE_TEXT;

        // 按钮状态控制
        let btnState = 0; // 0: 初始, 1: 点了不想练, 2: 点了还是不想, 3: 认错

        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            const mainDisplay = document.getElementById('mainDisplay');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const discussCountdownDisplay = document.getElementById('discussCountdownDisplay');
            const scheduleDisplay = document.getElementById('scheduleDisplay');
            const btnContainer = document.getElementById('btnContainer');

            // 1. 始终显示科目表
            const today = now.getDay();
            const tomorrow = (today + 1) % 7;
            scheduleDisplay.innerHTML = `今日科目：<span>${scheduleMap[today]}</span> | 明日科目：<span>${scheduleMap[tomorrow]}</span>`;

            // 2. 始终显示距离小组讨论的倒计时
            let discussTarget = new Date(now);
            discussTarget.setHours(22, 30, 0, 0);
            let discussDiff = discussTarget - now;
            if (discussDiff > 0) {
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> 距离小组讨论还有：${formatTime(discussDiff)}`;
            } else {
                discussCountdownDisplay.innerHTML = `<span class="heartbeat-anim">🔥</span> 小组讨论进行中...`;
            }

            // 3. 根据时间段切换主提示
            mainDisplay.innerHTML = '';
            countdownDisplay.innerHTML = '';
            btnContainer.innerHTML = ''; // 每次重置按钮

            // === 22:30 之后：小组讨论模式 ===
            if (hours > 22 || (hours === 22 && minutes >= 30)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = '什么时间该做什么事了哦，<br>昨天的讨论已经开了个好头了哦。<br><span style="font-size:0.8em; color:#fff;">张正凯老师友情提示：<br>把你们的数理化作业收起来哦！</span>';
            } 
            // === 19:00 - 22:29：练字结束灵魂拷问 ===
            else if (hours >= 19) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#95a5a6'; // 换成冷色调
                mainDisplay.style.textShadow = '3px 3px 0 #2c3e50, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '今天练字已经完成，<br>具体怎么样还是要靠自觉啊 🤔';
            } 
            // === 18:50 - 19:00：练字大字报 ===
            else if (hours === 18 && minutes >= 50) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#f1c40f'; // 恢复亮黄色
                mainDisplay.style.textShadow = '3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '什么时间该做什么事了，<br>不需要我多说了吧！';
                
                // 显示练字倒计时
                let practiceTarget = new Date(now);
                practiceTarget.setHours(19, 0, 0, 0); // 倒计时到19:00结束
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏱️</span> 距离练字结束还有：${formatTime(practiceDiff)}`;
                }

                // 渲染按钮逻辑
                renderButtons(btnContainer);
            } 
            // === 18:50 之前：练字提示模式 ===
            else {
                mainDisplay.className = 'sub-text';
                mainDisplay.innerHTML = '语文也是150分哦，虽然不像数学物理那么难学，但也是重要的哦 ✍️';
                
                let practiceTarget = new Date(now);
                practiceTarget.setHours(18, 50, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> 距离练字还有：${formatTime(practiceDiff)}`;
                }
            }
        }

        // 渲染按钮逻辑
        function renderButtons(container) {
            if (btnState === 0) {
                container.innerHTML = `<button class="btn btn-rebel" onclick="changeBtnState(1)">我不想练字</button>`;
            } else if (btnState === 1) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#e67e22;">你做的这道题，高考肯定不考。<br>但是你高考总是要写字的啊。</div>
                    <button class="btn btn-stubborn" onclick="changeBtnState(2)">我还是不想练字</button>
                `;
            } else if (btnState === 2) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#c0392b; font-weight:bold;">再不练字你的人生已经掉链子了！！</div>
                    <button class="btn btn-admit" onclick="changeBtnState(3)">恩师我知道错了，我这就去练字</button>
                `;
            } else if (btnState === 3) {
                container.innerHTML = `<div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#2ecc71;">知错能改，善莫大焉！赶紧动笔吧！✍️</div>`;
            }
        }

        // 切换按钮状态
        window.changeBtnState = function(state) {
            btnState = state;
            checkTime(); // 重新渲染
        }

        // 格式化时间函数
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 页面加载时立即执行一次
        checkTime();
        setInterval(checkTime, 1000);
    </script>
</body>
</html>
