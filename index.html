<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级日程提醒</title>
    <style>
        /* 全局样式：彻底抛弃宋体，使用微软雅黑 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* 顶部滚动横幅样式 */
        .marquee-container {
            position: absolute; top: 0; width: 100%;
            background-color: #e74c3c; padding: 15px 0;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10;
        }
        marquee { color: #fff; }

        /* 主内容区域样式 */
        .content-box { text-align: center; padding: 20px; max-width: 90%; }

        /* 大字报核心文字样式 */
        .main-text {
            font-size: 5vw; font-weight: 900; line-height: 1.3;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        /* 倒计时通用样式 */
        .countdown {
            font-size: 3vw; font-weight: bold; margin-top: 20px;
            font-family: 'Courier New', Courier, monospace; 
        }
        .countdown.practice { color: #3498db; } 
        .countdown.discuss { color: #2ecc71; }  

        /* 倒计时趣味心跳动画 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }
        .heartbeat-anim { display: inline-block; animation: heartbeat 1s infinite; }

        /* 提示文字与按钮样式 */
        .sub-text { font-size: 3vw; color: #bdc3c7; margin-top: 30px; line-height: 1.6; }
        .btn-group { margin-top: 40px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px; font-size: 2vw; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-rebel { background-color: #e67e22; color: #fff; }
        .btn-stubborn { background-color: #c0392b; color: #fff; }
        .btn-admit { background-color: #27ae60; color: #fff; }

        /* 底部信息栏（包含科目表与日期时间） */
        .bottom-bar {
            position: absolute; bottom: 30px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* 科目表样式 */
        .schedule {
            font-size: 2.5vw; line-height: 1.8; color: #ecf0f1;
            background: rgba(255,255,255,0.1); padding: 15px 40px; border-radius: 10px;
        }
        .schedule span { color: #f1c40f; font-weight: bold; }

        /* 自动更新日期时间样式 */
        .realtime-clock {
            font-size: 2vw; color: #95a5a6;
            font-family: 'Courier New', Courier, monospace; 
        }

        /* 呼吸闪烁动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 顶部滚动横幅 -->
    <div class="marquee-container">
        <marquee id="customMarquee" behavior="scroll" direction="left" scrollamount="8"></marquee>
    </div>

    <!-- 主内容区域 -->
    <div class="content-box">
        <div id="mainDisplay"></div>

        <div id="btnContainer" class="btn-group"></div>

    <!-- 底部信息栏 -->
    <div class="bottom-bar">
        <div id="scheduleDisplay" class="schedule"></div>
        <div id="clockDisplay" class="realtime-clock"></div> 
    </div>

    <script>
        // ================= 自定义配置区 =================
        const MARQUEE_TEXT = " 师说  作者：韩愈  原文  古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。嗟（jiē）乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎！爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读（dòu）者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不（fǒu）焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。”呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！圣人无常师。孔子师郯子（tán）、苌弘、师襄、老聃（dān）。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。  译文古代求学的人一定有老师。老师是传授道理，教授学业，解决疑难问题的人。人不是生下来就懂得道理的，谁能没有疑惑？有疑惑却不跟从老师学习，他所存在的疑惑，就始终不能解决。在我之前出生的人，他懂得道理本来就比我早，我跟从他，拜他为师；在我之后出生的人，他懂得道理如果也比我早，我也跟从他学习，把他当作老师，我学习的是道理，哪里管他的年龄比我大还是比我小呢？因此，不论地位显贵还是地位低下，不论年长年少，道理存在的地方，就是老师存在的地方。唉！从师学习的风尚没有流传已经很久了，想要人们没有疑惑很难呐！古代的圣人，他们超过一般人很远了，尚且跟从老师向老师请教；现在的一般人，他们跟圣人相比相差很远了，却以向老师学为羞耻。所以圣人就更加圣明，愚人就更加愚昧。圣人之所以成为圣人，愚人之所以成为愚人，大概都是这个原因引起的吧！众人喜爱他们的孩子，选择老师教育孩子；他们自己呢，却以从师学习为耻，这真是糊涂啊！那孩子的老师，教他们读书，学习书中的文句，并不是我所说的给人传授道理，给人解释疑惑的老师。不理解文句，疑惑得不到解决，有的向老师学习，有的却不向老师求教（意思是不知句读的倒要从师，不能解惑的却不从师），小的方面学习，大的方面却放弃了，我看不出他们有什么明智的呢。医生，乐师及各种工匠，不以互相学习为耻。士大夫这类人中，如有人称人家为老师，称自己为学生，这些人就聚集在一起嘲笑他。问那些嘲笑者（嘲笑他的原因），他们就说："那个人与某人年龄相近，修养和学业也差不多，（怎么能称他为老师呢？）以地位低的人为师，足以感到羞愧，称官位高的人为师就近于谄媚。"啊！从师学习的风尚不能恢复，由此就可以知道了。医生、乐师及各种工匠，士大夫之类的人是不屑与他们为伍的，现在士大夫们的智慧反而不如他们。难道值得奇怪吗？圣人没有固定的老师，孔子曾经以郯子、苌弘、师襄、老聃为师。郯子这一类人，他们的道德才能（当然）不如孔子。孔子说："几个人走在一起，其中就一定有我的老师。"因此学生不一定不如老师，老师也不一定比弟子强，听闻道理有先有后，学问和技艺上各有各的主攻方向，像这样罢了。李蟠，十七岁，爱好古文，六经的经文和传文都普遍学习了，不被世俗的限制，向我学习。我赞许他能遵行古人从师学习的风尚，特别写了这篇《师说》来赠给他。  注释［1］学者：求学的人。［2］道：指儒家孔子、孟轲的哲学、政治等原理、原则。可以参看本书上面所选韩愈《原道》。［3］受：通“授”。传授。［4］业：泛指古代经、史、诸子之学及古文写作，可以参看本书下面所选韩愈《进学解》中所述作者治学内容。［5］人非生而知之者：人不是生下来就懂得道理。之，指知识和道理。语本《论语·述而》：“子曰：‘我非生而知之者，好古敏以求之者也。’”《论语·季氏》：“孔子曰：‘生而知之者，上也；学而知之者，次也。’”孔子承认有生而知之的人，但认为自己并非这样。韩愈则进一步明确没有生而知之的人。［6］其为惑也:他所存在的疑惑。［7］闻道：语本《论语·里仁》：“子曰：‘朝闻道，夕死可矣。’”闻，听见，引伸为懂得。道：这里作动词用，学习、从师的意思。［8］从而师之：跟从（他），拜他为老师。师之，即以之为师。［9］夫庸知其年之先后生于吾乎：哪管他的生年是比我早还是比我晚呢？庸，岂，哪。知，了解，知道。［10］道之所存，师之所存：知识、道理存在的（地方），就是老师存在的（地方）。意思是谁懂得道理，谁就是自己的老师。［11］师道：以师为道。即学道。道，这里有风尚的意思。［12］出人：超出（一般）人。［13］众人：普通人。［14］耻学于师：以向老师学习为耻。［15］是故圣益圣，愚益愚：因此圣人更加圣明，愚人更加愚昧。益，更加，越发。［16］惑矣：（真）糊涂啊！［17］彼童子之师：那些教小孩子的（启蒙）老师。［18］句读（dòu逗）：也叫句逗。古代称文辞意尽处为句，语意未尽而须停顿处为读（逗），句号为圈，逗号为点。古代书籍上没有标点，老师教学童读书时要进行句逗的教学。读，通“逗”。［19］或师焉，或不（fǒu）焉：有的（指“句读之不知”这样的小事）请教老师，有的（指“惑之不解”这样的大事）却不问老师。“不”同“否”。此句翻译时应注意交错翻译，详见下文翻译。［20］小学而大遗：小的方面（句读之不知）倒要学习，大的方面（惑之不解）却放弃了。［21］巫医：古代用祝祷、占卜等迷信方法或兼用药物医治疾病为业的人，连称为巫医。《逸周书·大聚》有关于“巫医”的记载。《论语·季氏》：“人而无恒，不可以作巫医。”视为一种低下的职业。［22］百工：泛指手工业者。［23］相若：相象，差不多的意思。［24］位卑则足羞：(以)地位低（的人为师），就感到耻辱。［25］谀（yú）：阿谀、奉承。［26］复：恢复。［27］君子：古代“君子”有两层意思，一是指地位高的人，一是指品德高的人。这里用前一种意思，相当于士大夫。［28］不齿：不屑与之同列，即看不起。或作“鄙之”。［29］其可怪也欤：难道值得奇怪吗？其，语气词，起加强反问语气作用。［30］圣人无常师：《论语·子张》：“子贡曰‘……夫子焉不学，而亦何常师之有？’”夫子，老师，指孔子。子贡说他何处不学，又为什么要有一定的老师呢！［31］郯（tán）子：春秋时郯国（今山东郯城一带）的国君，孔子曾向他请教过少皞（ｈàｏ浩）氏（传说中古代帝王）时代的官职名称。［32］苌（cháng）弘：东周敬王时候的大夫，孔子曾向他请教古乐。师襄：春秋时鲁国的乐官，名襄，孔子曾向他学习弹琴。师，乐师。［33］老聃（dān丹）：即老子，春秋时楚国人，思想家，道家学派创始人。孔子曾向他请教礼仪。［34］三人行句：语本《论语·述而》：“子曰：‘三人行，必有我师焉。择其善者而从之，其不善者而改之。’”［35］不必：不一定。［36］术业有专攻：学问和技艺上（各）自有（各的）专门研究。攻：学习、研究。［37］李氏子蟠：李蟠（pán盘），唐德宗贞元十九年（803年）进士。［38］六艺经传（zhuàn）：六艺的经文和传文。六艺：指六经，即《诗》、《书》、《礼》、《乐》、《易》、《春秋》六部儒家经典。经：两汉及其以前的散文。传：注解经典的著作。［39］不拘于时：不被时俗所限制。时，时俗，指当时士大夫中耻于从师的不良风气。于，被［40］余嘉其能行古道。嘉：赞许［41］贻：赠送［42］不齿：不屑与之同列，表示鄙视。齿，原指年龄，也引伸为排列。幼马每年生一齿，故以齿计马岁数，也以指人的年龄。古人常依年龄长少相互排列次序。本句反映封建阶级的传统偏见。君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。故不登高山，不知天之高也；不临深溪，不知地之厚也；不闻先王之遗言，不知学问之大也。干、越、夷、貉之子，生而同声，长而异俗，教使之然也。诗曰：“嗟尔君子，无恒安息。靖共尔位，好是正直。神之听之，介尔景福。”神莫大于化道，福莫长于无祸。吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。(君子生 通：性)南方有鸟焉，名曰蒙鸠，以羽为巢，而编之以发，系之苇苕，风至苕折，卵破子死。巢非不完也，所系者然也。西方有木焉，名曰射干，茎长四寸，生于高山之上，而临百仞之渊，木茎非能长也，所立者然也。蓬生麻中，不扶而直；白沙在涅，与之俱黑。兰槐之根是为芷，其渐之滫，君子不近，庶人不服。其质非不美也，所渐者然也。故君子居必择乡，游必就士，所以防邪辟而近中正也。物类之起，必有所始。荣辱之来，必象其德。肉腐出虫，鱼枯生蠹。怠慢忘身，祸灾乃作。强自取柱，柔自取束。邪秽在身，怨之所构。施薪若一，火就燥也，平地若一，水就湿也。草木畴生，禽兽群焉，物各从其类也。是故质的张，而弓矢至焉；林木茂，而斧斤至焉；树成荫，而众鸟息焉。醯酸，而蜹聚焉。故言有招祸也，行有招辱也，君子慎其所立乎！积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。(江海 一作：江河)是故无冥冥之志者，无昭昭之明；无惛惛之事者，无赫赫之功。行衢道者不至，事两君者不容。目不能两视而明，耳不能两听而聪。螣蛇无足而飞，鼫鼠五技而穷。《诗》曰：“尸鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮！”故君子结于一也。昔者瓠巴鼓瑟，而流鱼出听；伯牙鼓琴，而六马仰秣。故声无小而不闻，行无隐而不形。玉在山而草木润，渊生珠而崖不枯。为善不积邪？安有不闻者乎？学恶乎始？恶乎终？曰：其数则始乎诵经，终乎读礼；其义则始乎为士，终乎为圣人，真积力久则入，学至乎没而后止也。故学数有终，若其义则不可须臾舍也。为之，人也；舍之，禽兽也。故书者，政事之纪也；诗者，中声之所止也；礼者，法之大分，类之纲纪也，故学至乎礼而止矣。夫是之谓道德之极。礼之敬文也，乐之中和也，诗书之博也，春秋之微也，在天地之间者毕矣。君子之学也，入乎耳，箸乎心，布乎四体，形乎动静。端而言，蝡而动，一可以为法则。小人之学也，入乎耳，出乎口；口耳之间，则四寸耳，曷足以美七尺之躯哉！古之学者为己，今之学者为人。君子之学也，以美其身；小人之学也，以为禽犊。故不问而告谓之傲，问一而告二谓之囋。傲非也，囋非也；君子如向矣。学莫便乎近其人。礼乐法而不说，诗书故而不切，春秋约而不速。方其人之习君子之说，则尊以遍矣，周于世矣。故曰：学莫便乎近其人。学之经莫速乎好其人，隆礼次之。上不能好其人，下不能隆礼，安特将学杂识志，顺诗书而已耳。则末世穷年，不免为陋儒而已。将原先王，本仁义，则礼正其经纬蹊径也。若挈裘领，诎五指而顿之，顺者不可胜数也。不道礼宪，以诗书为之，譬之犹以指测河也，以戈舂黍也，以锥餐壶也，不可以得之矣。故隆礼，虽未明，法士也；不隆礼，虽察辩，散儒也。问楛者，勿告也；告楛者，勿问也；说楛者，勿听也。有争气者，勿与辩也。故必由其道至，然后接之；非其道则避之。故礼恭，而后可与言道之方；辞顺，而后可与言道之理；色从而后可与言道之致。故未可与言而言，谓之傲；可与言而不言，谓之隐；不观气色而言，谓瞽。故君子不傲、不隐、不瞽，谨顺其身。诗曰：“匪交匪舒，天子所予。”此之谓也。百发失一，不足谓善射；千里蹞步不至，不足谓善御；伦类不通，仁义不一，不足谓善学。学也者，固学一之也。一出焉，一入焉，涂巷之人也；其善者少，不善者多，桀纣盗跖也；全之尽之，然后学者也。君子知夫不全不粹之不足以为美也，故诵数以贯之，思索以通之，为其人以处之，除其害者以持养之。使目非是无欲见也，使耳非是无欲闻也，使口非是无欲言也，使心非是无欲虑也。及至其致好之也，目好之五色，耳好之五声，口好之五味，心利之有天下。是故权利不能倾也，群众不能移也，天下不能荡也。生乎由是，死乎由是，夫是之谓德操。德操然后能定，能定然后能应。能定能应，夫是之谓成人。天见其明，地见其光，君子贵其全也。";

            if (hours > 22 || (hours === 22 && minutes >= 30)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = '什么时间该做什么事了哦，<br>昨天的讨论已经开了个好头了哦。<br><span style="font-size:0.8em; color:#fff;">张正凯老师友情提示：<br>把你们的数理化作业收起来哦！</span>';
            } 
            // === 19:00 - 22:29：练字结束灵魂拷问 ===
            else if (hours >= 19) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#95a5a6'; 
                mainDisplay.style.textShadow = '3px 3px 0 #2c3e50, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '今天练字已经完成，<br>具体怎么样还是要靠自觉啊 🤔';
            } 
            // === 18:50 - 19:00：练字大字报 + 按钮触发区 ===
            else if (hours === 18 && minutes >= 50) {
                mainDisplay.className = 'main-text';
                mainDisplay.style.color = '#f1c40f'; 
                mainDisplay.style.textShadow = '3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3)';
                mainDisplay.innerHTML = '什么时间该做什么事了，<br>不需要我多说了吧！';
                
                let practiceTarget = new Date(now);
                practiceTarget.setHours(19, 0, 0, 0); 
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏱️</span> 距离练字结束还有：${formatTime(practiceDiff)}`;
                }
                
                // 【核心修复】在这里渲染按钮逻辑
                renderButtons(btnContainer);
            } 
            // === 18:50 之前：练字提示模式 ===
            else {
                mainDisplay.className = 'sub-text';
                mainDisplay.innerHTML = '语文也是150分哦，虽然不像数学物理那么难学，但也是重要的哦 ✍️';
                
                let practiceTarget = new Date(now);
                practiceTarget.setHours(18, 50, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `<span class="heartbeat-anim">⏳</span> 距离练字还有：${formatTime(practiceDiff)}`;
                }
            }
        }

        // 【核心修复】渲染按钮的独立函数
        function renderButtons(container) {
            if (btnState === 0) {
                container.innerHTML = `<button class="btn btn-rebel" onclick="changeBtnState(1)">我不想练字</button>`;
            } else if (btnState === 1) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#e67e22;">你做的这道题，高考肯定不考。<br>但是你高考总是要写字的啊。</div>
                    <button class="btn btn-stubborn" onclick="changeBtnState(2)">我还是不想练字</button>
                `;
            } else if (btnState === 2) {
                container.innerHTML = `
                    <div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#c0392b; font-weight:bold;">再不练字你的人生已经掉链子了！！</div>
                    <button class="btn btn-admit" onclick="changeBtnState(3)">恩师我知道错了，我这就去练字</button>
                `;
            } else if (btnState === 3) {
                container.innerHTML = `<div class="sub-text" style="margin-top:0; font-size:2.5vw; color:#2ecc71;">知错能改，善莫大焉！赶紧动笔吧！✍️</div>`;
            }
        }

        // 切换按钮状态
        window.changeBtnState = function(state) {
            btnState = state;
            checkTime(); 
        }

        // 格式化时间函数
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 页面加载时立即执行一次
        checkTime();
        updateClock();
        setInterval(checkTime, 1000);
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
